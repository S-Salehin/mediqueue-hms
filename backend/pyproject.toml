[tool.ruff]
target-version = "py314"
line-length = 160
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["accounts", "communications", "core", "directory", "operations"]
omit = ["*/migrations/*", "*/management/commands/seed_synthetic.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
