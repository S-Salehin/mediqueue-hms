name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the approved environment file}

x-app-environment: &app-environment
  APP_VERSION: ${APP_VERSION:?Set APP_VERSION to the reviewed Git commit}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with a URL encoded password}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY to a separate random secret}
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS}
  DJANGO_SECURE_COOKIES: "true"
  DJANGO_BEHIND_PROXY: "true"
  DJANGO_SECURE_SSL_REDIRECT: "true"
  DJANGO_HSTS_SECONDS: "31536000"
  HOSPITAL_TIME_ZONE: Asia/Dhaka
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-5}
  SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:?Set SESSION_IDLE_TIMEOUT_SECONDS}
  SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:?Set SESSION_ABSOLUTE_TIMEOUT_SECONDS}

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: 20m

services:
  db-storage-init:
    image: ${DATABASE_IMAGE:?Set DATABASE_IMAGE to the approved digest}
    restart: "no"
    init: true
    user: 0:0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        mkdir -p /var/lib/postgresql/18/docker /var/run/postgresql /var/spool/pgbackrest /var/lib/pgbackrest;
        chown 70:70 /var/lib/postgresql /var/lib/postgresql/18 /var/lib/postgresql/18/docker /var/run/postgresql /var/spool/pgbackrest /var/lib/pgbackrest;
        chmod 0700 /var/lib/postgresql/18/docker;
        chmod 03775 /var/run/postgresql;
        chmod 0750 /var/spool/pgbackrest /var/lib/pgbackrest
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_socket:/var/run/postgresql
      - backup_spool:/var/spool/pgbackrest
      - backup_repository:/var/lib/pgbackrest
    tmpfs:
      - /tmp:size=4m,mode=1770
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 20

  db:
    <<: *service-defaults
    image: ${DATABASE_IMAGE:?Set DATABASE_IMAGE to the approved digest}
    user: 70:70
    cap_drop: [ALL]
    read_only: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MEDIQUEUE_MIGRATION_USER: ${MEDIQUEUE_MIGRATION_USER:?Set MEDIQUEUE_MIGRATION_USER}
      MEDIQUEUE_MIGRATION_PASSWORD: ${MEDIQUEUE_MIGRATION_PASSWORD:?Set MEDIQUEUE_MIGRATION_PASSWORD}
      MEDIQUEUE_APP_USER: ${MEDIQUEUE_APP_USER:?Set MEDIQUEUE_APP_USER}
      MEDIQUEUE_APP_PASSWORD: ${MEDIQUEUE_APP_PASSWORD:?Set MEDIQUEUE_APP_PASSWORD}
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_PASSPHRASE:?Set BACKUP_ENCRYPTION_PASSPHRASE}
      PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_DAYS:-30}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      TZ: UTC
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=mediqueue archive-push %p
      - -c
      - archive_timeout=300
      - -c
      - log_min_duration_statement=1000
      - -c
      - max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_socket:/var/run/postgresql
      - backup_spool:/var/spool/pgbackrest
      - backup_repository:/var/lib/pgbackrest
    tmpfs:
      - /tmp:size=16m,mode=1770,uid=70,gid=70
      - /var/log/pgbackrest:size=16m,mode=0750,uid=70,gid=70
    networks:
      - data
    depends_on:
      db-storage-init:
        condition: service_completed_successfully
    shm_size: 256m
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 200
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backup:
    <<: *service-defaults
    image: ${DATABASE_IMAGE:?Set DATABASE_IMAGE to the approved digest}
    user: postgres
    cap_drop: [ALL]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        until pg_isready --host=/var/run/postgresql --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"; do sleep 2; done;
        pgbackrest --stanza=mediqueue stanza-create;
        pgbackrest --stanza=mediqueue check;
        touch /tmp/backup-ready;
        exec sleep infinity
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_PASSPHRASE:?Set BACKUP_ENCRYPTION_PASSPHRASE}
      PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_DAYS:-30}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
        read_only: true
      - postgres_socket:/var/run/postgresql
      - backup_spool:/var/spool/pgbackrest
      - backup_repository:/var/lib/pgbackrest
    tmpfs:
      - /tmp:size=16m,mode=1770,uid=70,gid=70
    read_only: true
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/backup-ready && pgbackrest --stanza=mediqueue --output=json info >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    <<: *service-defaults
    image: ${APP_IMAGE:?Set APP_IMAGE to the approved digest}
    environment: *app-environment
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--threads", "2", "--timeout", "60", "--error-logfile", "-"]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=10001,gid=10001
    networks:
      - data
      - service
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 200
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; h=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready/',headers={'Host':h,'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  worker:
    <<: *service-defaults
    image: ${APP_IMAGE:?Set APP_IMAGE to the approved digest}
    environment: *app-environment
    command: ["python", "manage.py", "process_outbox", "--loop"]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1770,uid=10001,gid=10001
    networks:
      - data
      - service
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 20s
      timeout: 3s
      retries: 4
      start_period: 15s

  caddy-storage-init:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the approved digest}
    restart: "no"
    init: true
    user: 0:0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chown 10002:10002 /data /config;
        chmod 0700 /data /config
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=4m,mode=1770
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 20

  web:
    <<: *service-defaults
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the approved digest}
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - ${HTTP_PORT:-80}:8080
      - ${HTTPS_PORT:-443}:8443
      - ${HTTPS_PORT:-443}:8443/udp
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    user: 10002:10002
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m,mode=1770
    networks:
      - service
    depends_on:
      api:
        condition: service_healthy
      caddy-storage-init:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8090/healthz || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s

networks:
  data:
    internal: true
  service:

volumes:
  postgres_data:
  postgres_socket:
  backup_spool:
  backup_repository:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_REPOSITORY_PATH:?Set BACKUP_REPOSITORY_PATH to an approved absolute host path}
  caddy_data:
  caddy_config:
