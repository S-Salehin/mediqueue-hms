name: Change proposal
description: Propose a scoped product, operational, or documentation change
title: "Change: "
labels: [proposal, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain who is affected and what they cannot do safely today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: Describe measurable acceptance conditions, not an implementation preference.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Patient
        - Doctor
        - Receptionist
        - Administrator
        - Operator
        - University reviewer
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Scope boundary
      description: State what this proposal deliberately leaves unchanged.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Safety, privacy, and operational effect
      description: Include new data, permissions, dependencies, migrations, notifications, and failure modes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link approved research or sanitized workflow evidence. Never attach real patient data.
