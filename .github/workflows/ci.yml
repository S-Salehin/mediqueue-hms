name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.7"
  NODE_VERSION: "24.19.0"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:f65cfc1a73466fc0807f4a33496e1c438b19269091c8f998faec871874df8e5e
        env:
          POSTGRES_DB: mediqueue_ci
          POSTGRES_USER: mediqueue_ci
          POSTGRES_PASSWORD: ci-database-password
        options: >-
          --health-cmd "pg_isready -U mediqueue_ci -d mediqueue_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://mediqueue_ci:ci-database-password@127.0.0.1:5432/mediqueue_ci
      DJANGO_SECRET_KEY: ci-only-django-secret-key-that-is-longer-than-fifty-characters-2026
      MFA_ENCRYPTION_KEY: ci-only-separate-mfa-encryption-key-2026
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SECURE_COOKIES: "false"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install exact dependencies
        run: python -m pip install --requirement backend/requirements.txt --requirement backend/requirements-dev.txt

      - name: Check Python style
        working-directory: backend
        run: ruff check .

      - name: Check Django configuration and migrations
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run Django deployment checks
        working-directory: backend
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-long-random-looking-secret-key-for-deployment-checks-2026
          MFA_ENCRYPTION_KEY: ci-only-deploy-check-mfa-encryption-key-2026
          DJANGO_SECURE_COOKIES: "true"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_BEHIND_PROXY: "true"
          DJANGO_CSRF_TRUSTED_ORIGINS: https://pilot.example.test
        run: python manage.py check --deploy

      - name: Run backend tests and coverage gate
        working-directory: backend
        run: |
          coverage run manage.py test --verbosity 2
          coverage report --show-missing --fail-under=85
          coverage xml -o backend-coverage.xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/backend-coverage.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run frontend tests and coverage gate
        run: npm run test:coverage

      - name: Build the production application
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14

  compose:
    name: Compose and image checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local Compose
        run: docker compose --env-file .env.example --file compose.yml config --quiet

      - name: Validate test Compose
        run: docker compose --env-file .env.test.example --file compose.test.yml config --quiet

      - name: Lint operational shell scripts
        run: >-
          docker run --rm -v "$PWD:/mnt:ro"
          koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
          shellcheck --severity=warning
          /mnt/scripts/_common.sh
          /mnt/scripts/backup.sh
          /mnt/scripts/deploy.sh
          /mnt/scripts/destroy-restore.sh
          /mnt/scripts/recovery-test.sh
          /mnt/scripts/restore.sh
          /mnt/scripts/rollback.sh
          /mnt/scripts/smoke-test.sh
          /mnt/scripts/validate-production.sh
          /mnt/infra/postgres/init/10-create-application-role.sh

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Validate Caddy policies
        run: |
          docker run --rm -e PUBLIC_HOSTNAME=pilot.example.test -e ACME_EMAIL=ops@example.test -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e PUBLIC_HOSTNAME=:80 -e ACME_EMAIL=ops@example.test -v "$PWD/infra/caddy/Caddyfile.test:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e PUBLIC_HOSTNAME=:80 -e ACME_EMAIL=ops@example.test -v "$PWD/infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 caddy validate --config /etc/caddy/Caddyfile

      - name: Build application images
        run: |
          docker build --file infra/docker/backend.Dockerfile --tag mediqueue-api:ci .
          docker build --file infra/docker/frontend.Dockerfile --tag mediqueue-web:ci .
          docker build --file infra/docker/postgres.Dockerfile --tag mediqueue-db:ci .
          docker run --rm --entrypoint pgbackrest mediqueue-db:ci version

      - name: Start the disposable test stack
        run: docker compose --env-file .env.test.example --file compose.test.yml up --detach --wait --wait-timeout 180 db api worker web

      - name: Verify same-origin health routes
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:8081/api/v1/health/live/
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:8081/api/v1/health/ready/
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:8081/ >/dev/null

      - name: Seed isolated browser test records
        run: >-
          docker compose --env-file .env.test.example --file compose.test.yml
          exec --no-TTY --env DJANGO_DEBUG=true api
          python manage.py seed_synthetic --doctors 3 --appointments 6

      - name: Set up Node.js for browser tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run same-origin Chromium workflows
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
        run: npm run test:e2e

      - name: Verify encrypted backup and isolated restore
        run: bash scripts/recovery-test.sh --confirm RECOVERY-TEST:mediqueue-recovery-test

      - name: Show service logs after a failure
        if: failure()
        run: docker compose --env-file .env.test.example --file compose.test.yml logs --no-color

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the disposable test stack
        if: always()
        run: docker compose --env-file .env.test.example --file compose.test.yml down --volumes --remove-orphans
