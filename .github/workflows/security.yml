name: Security review

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-scan:
    name: Filesystem vulnerability and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table

  python-security:
    name: Python dependency and source review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install the application and security tools
        run: python -m pip install --requirement backend/requirements.txt --requirement backend/requirements-dev.txt pip-audit==2.10.1 bandit==1.9.4 semgrep==1.173.0

      - name: Audit Python packages
        run: python -m pip_audit --requirement backend/requirements.txt

      - name: Check Python source for high confidence defects
        run: bandit --recursive backend --exclude backend/accounts/tests,backend/communications/tests,backend/operations/tests --severity-level medium --confidence-level medium

      - name: Check Django and Python security patterns
        run: semgrep scan --config p/django --config p/python --error --metrics=off backend

  javascript-security:
    name: JavaScript dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit production packages
        run: npm audit --omit=dev --audit-level=high
