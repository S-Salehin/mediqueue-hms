version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, frontend]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, backend]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels: [dependencies, operations]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels: [dependencies, operations]
